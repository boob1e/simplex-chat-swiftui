name: SimpleX
options:
  bundleIdPrefix: chat.simplex.mac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  # Shared Swift wrapper around the Haskell core. Sources are compiled straight
  # from apps/ios/SimpleXChat so model and API types stay in sync with iOS.
  SimpleXChat:
    type: framework
    platform: macOS
    sources:
      - path: ../ios/SimpleXChat
        excludes:
          - "*.lproj"
          - "SimpleXChat.docc"
          - "SimpleXChat.h"
          - "dummy.m"
          - "ImageUtils.swift"
          - "exported_symbols.txt"
        headerVisibility: public
      - path: SimpleXChatMac
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.simplex.mac.SimpleXChat
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Libraries
        # libsimplex plus the GHC runtime, which exports hs_init_with_rtsopts
        OTHER_LDFLAGS: -lsimplex -lHSrts-1.0.2_thr-ghc9.6.3
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/Frameworks @loader_path/../.."

  SimpleX:
    type: application
    platform: macOS
    sources:
      - path: SimpleX
      # Chat command / response / event types shared with the iOS app
      - path: ../ios/Shared/Model/AppAPITypes.swift
    dependencies:
      - target: SimpleXChat
    postBuildScripts:
      - name: Embed Haskell core
        script: "\"${PROJECT_DIR}/scripts/embed-core.sh\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: SimpleX
        PRODUCT_BUNDLE_IDENTIFIER: chat.simplex.mac.app
        INFOPLIST_FILE: SimpleX/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimpleX/Resources/SimpleX.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Libraries
        # the app calls a few core functions directly (e.g. chat_valid_name)
        OTHER_LDFLAGS: -lsimplex
        ENABLE_USER_SCRIPT_SANDBOXING: NO
